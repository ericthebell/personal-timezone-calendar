version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timezone-calendar-api
    ports:
      - "${PORT:-5001}:5001"
    environment:
      - PORT=5001
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-America/New_York}
      - FEED_SECRET=${FEED_SECRET:-change-me-in-production}
    volumes:
      # Persist calendar and settings configuration
      - ./data/calendars.json:/app/config/calendars.json
      - ./data/settings.json:/app/config/settings.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Optional: Frontend admin UI
  # Uncomment if you want to run the React frontend in Docker
